[project]
name = "am-energy"
version = "0.2.0"
description = "Silver and gold transformations for the fabric-am-energy portfolio project (simulated data)"
requires-python = ">=3.11"
license = "MIT"
# No runtime dependencies: Fabric Spark provides pyspark and delta. Built as a wheel for a Fabric Environment.
dependencies = []

[dependency-groups]
dev = [
  "pyspark==4.1.1",      # Fabric Runtime 2.0: Spark 4.1
  "delta-spark==4.2.0",  # Fabric Runtime 2.0: Delta 4.2
  "pytest>=8",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/am_energy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
