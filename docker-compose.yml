# Edge side of the lab: OPC UA simulator → edge gateway → Fabric Eventstream (or local JSON files).
#   docker compose up --build
#   docker compose kill -s USR1 gateway   # toggle a simulated network outage
services:
  opcua-sim:
    build: { context: ., dockerfile: edge/Dockerfile }
    command: ["node", "--import", "tsx", "opcua-sim/src/main.ts"]
    environment:
      OPCUA_PORT: "4840"
      DURATION_SCALE: ${DURATION_SCALE:-1}
      PKI_FOLDER: /data/pki
    ports: ["4840:4840"]
    volumes: [sim-data:/data]
    restart: unless-stopped

  gateway:
    build: { context: ., dockerfile: edge/Dockerfile }
    command: ["node", "--import", "tsx", "gateway/src/main.ts"]
    depends_on: [opcua-sim]
    env_file:
      - path: .env
        required: false
    environment:
      OPCUA_ENDPOINT: opc.tcp://opcua-sim:4840/UA/AMEnergySim
      SINK: ${SINK:-file}
      SCHEMA_VERSION: ${SCHEMA_VERSION:-1}
      FILE_SINK_DIR: /data/out
      BUFFER_PATH: /data/buffer.sqlite
      PKI_FOLDER: /data/pki
    volumes: [gateway-data:/data]
    restart: unless-stopped

volumes:
  sim-data:
  gateway-data:
